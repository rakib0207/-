async function mkpdf(){const jd=new Uint8Array(await (await new Promise(r=>cv.toBlob(r,'image/jpeg',.92))).arrayBuffer());
const w=cv.width,h=cv.height,E=new TextEncoder(),P=[],o=[];let n=0;const add=u=>{P.push(u);n+=u.length},put=s=>add(E.encode(s)),ob=(i,s)=>{o[i]=n;put(`${i} 0 obj\n${s}\nendobj\n`)};
put('%PDF-1.4\n');ob(1,'<</Type/Catalog/Pages 2 0 R>>');ob(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
ob(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${w} ${h}]/Resources<</XObject<</I 4 0 R>>>>/Contents 5 0 R>>`);
o[4]=n;put(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jd.length}>>\nstream\n`);add(jd);put('\nendstream\nendobj\n');
const c=`q ${w} 0 0 ${h} 0 0 cm /I Do Q`;ob(5,`<</Length ${c.length}>>\nstream\n${c}\nendstream`);
const x=n;put('xref\n0 6\n0000000000 65535 f \n'+[1,2,3,4,5].map(i=>String(o[i]).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`);
return new Blob(P,{type:'application/pdf'})}
async function dl(t){const m=$('dm');m.textContent="";let d=null;try{d=window.claude&&await window.claude.use("downloads")}catch(e){}
if(!d){m.textContent="এখানে ডাউনলোড চালু নেই। ম্যাপে লং-প্রেস বা রাইট-ক্লিক করে ছবি সেভ করুন।";return}
const b=t==="pdf"?await mkpdf():await new Promise(r=>cv.toBlob(r,t==="png"?"image/png":"image/jpeg",.92));
try{await d.save({filename:"amar-bangladesh-map."+t,data:b})}catch(e){if(e.code!=="declined")m.textContent="ডাউনলোড হয়নি, আবার চেষ্টা করুন।"}}
$('dp').onclick=()=>dl("png");$('dj').onclick=()=>dl("jpg");$('df').onclick=()=>dl("pdf");

const Q=[["সুন্দরবন কোন বিভাগে?",["খুলনা","বরিশাল","চট্টগ্রাম","রাজশাহী"],0],["কক্সবাজার সমুদ্রসৈকতের বিশেষত্ব কী?",["সবচেয়ে ছোট সৈকত","বিশ্বের দীর্ঘতম অবিচ্ছিন্ন সৈকতগুলোর একটি","পাথুরে সৈকত","নদীর তীরের সৈকত"],1],["কীর্তনখোলা নদী কোন জেলায়?",["সিলেট","বরিশাল","রংপুর","কুষ্টিয়া"],1],["জাফলং কোন জেলায়?",["সিলেট","বান্দরবান","নেত্রকোণা","দিনাজপুর"],0],["বাংলাদেশের সর্বোচ্চ শৃঙ্গ তাজিংডং কোন জেলায়?",["রাঙামাটি","খাগড়াছড়ি","বান্দরবান","সিলেট"],2],["কাপ্তাই লেক কোন জেলায়?",["রাঙামাটি","কক্সবাজার","ফেনী","কুমিল্লা"],0],["মহাস্থানগড় কোন জেলায়?",["নাটোর","বগুড়া","পাবনা","জয়পুরহাট"],1],["ষাটগম্বুজ মসজিদ কোন জেলায়?",["যশোর","খুলনা","বাগেরহাট","সাতক্ষীরা"],2],["বাংলাদেশের সর্ব উত্তরের জেলা কোনটি?",["পঞ্চগড়","কুড়িগ্রাম","লালমনিরহাট","ঠাকুরগাঁও"],0],["বাংলাদেশে মোট বিভাগ কয়টি?",["৭","৮","৯","১০"],1]];
let qs,qi,sc;
function qStart(){qs=[...Q].sort(()=>Math.random()-.5);qi=0;sc=0;qShow()}
function qShow(){const b=$('qb');if(qi>=qs.length){b.innerHTML=`<h2>🏆 স্কোর: ${bn(sc)} / ${bn(qs.length)}</h2><p>${sc>=8?'দারুণ! আপনি তো আসল ভ্রমণপ্রেমী।':sc>=5?'ভালোই চেনেন, আরও ঘুরে দেখুন!':'চলুন, নতুন জায়গা ঘুরে শিখে আসি!'}</p><button class="b p" id="rs">আবার খেলুন</button>`;$('rs').onclick=qStart;return}
const [q,o,a]=qs[qi];b.innerHTML=`<p class="m">প্রশ্ন ${bn(qi+1)} / ${bn(qs.length)}</p><h3>${q}</h3>`+o.map((t,i)=>`<button class="b o" data-i="${i}">${t}</button>`).join('')+'<div id="nx"></div>';
b.querySelectorAll('.o').forEach(x=>x.onclick=()=>{const i=+x.dataset.i;b.querySelectorAll('.o').forEach(y=>{y.disabled=true;if(+y.dataset.i===a)y.classList.add('ok')});
if(i===a)sc++;else x.classList.add('no');$('nx').innerHTML='<button class="b p" id="nb" style="margin-top:8px">পরের প্রশ্ন →</button>';$('nb').onclick=()=>{qi++;qShow()}})}
qStart();

const ps=new Set();
$('pc').innerHTML=ALL.map(d=>`<button>${d}</button>`).join('');
$('pc').onclick=e=>{const d=e.target.textContent;if(e.target.tagName!=="BUTTON")return;ps.has(d)?ps.delete(d):ps.add(d);e.target.classList.toggle('on')};
$('pg').onclick=()=>{const o=$('po'),a=[...ps],n=a.length,days=Math.max(1,+$('pd').value||1),pp=Math.max(1,+$('pt').value||1),bud=+$('pb').value||0;
if(!n){o.innerHTML='<p class="m">আগে অন্তত একটি জেলা বাছাই করুন।</p>';return}
let rows=[],d0=1;
if(n<=days){const base=Math.floor(days/n),ex=days%n;a.forEach((x,i)=>{const k=base+(i<ex?1:0);rows.push([k>1?`দিন ${bn(d0)}–${bn(d0+k-1)}`:`দিন ${bn(d0)}`,x]);d0+=k})}
else{const per=Math.ceil(n/days);for(let i=0;i<n;i+=per){rows.push([`দিন ${bn(d0++)}`,a.slice(i,i+per).join(" → ")])}}
let h='<ul>'+rows.map(r=>`<li><b>${r[0]}:</b> ${r[1]}</li>`).join('')+'</ul>';
if(bud)h+=`<p>মোট বাজেট ৳${bn(bud)} → দিনে জনপ্রতি প্রায় <b>৳${bn(Math.round(bud/days/pp))}</b></p>`;
h+=`<p class="m">${bn(n)}টি জেলা · ${bn(days)} দিন · ${bn(pp)} জন · আপনার বাছাই করা ক্রমে সাজানো</p>`;o.innerHTML=h};
